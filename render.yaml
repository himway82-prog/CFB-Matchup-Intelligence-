services:
  - type: web
    name: cfb-matchup-intelligence
    runtime: python
    plan: free
    buildCommand: "echo No extra Python packages required"
    startCommand: python server.py
    envVars:
      - key: CFBD_API_KEY
        sync: false
      - key: CFB_SEASON
        value: '2026'
      - key: CFB_REFRESH_HOURS
        value: '24'
